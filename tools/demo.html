<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Démo animation Djegui</title>
<style>html,body{margin:0;background:#000}canvas{image-rendering:pixelated;width:960px;height:540px;display:block}</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<script src="../src/core/util.js"></script>
<script src="../src/core/renderer.js"></script>
<script src="../src/core/font.js"></script>
<script src="../src/gfx/pixelart.js"></script>
<script src="../src/gfx/monsters.js"></script>
<script src="../src/gfx/modrig.js"></script>
<script src="../src/gfx/djegui_art.js"></script>
<script src="../src/gfx/djegui.js"></script>
<script src="../src/gfx/backgrounds.js"></script>
<script src="../src/gfx/fx.js"></script>
<script>
  // Démo déterministe : renderAt(t) avance la simulation jusqu'à t (pas fixe 1/60 s).
  let seed = 7;
  Math.random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  GS.R.init();
  GS.R.canvas.style.width = '960px'; GS.R.canvas.style.height = '540px';
  const ctx = GS.ctx;
  const rig = GS.Djegui.rig();
  const fx = new GS.FXLayer();
  const MR = GS.ModRig;
  const GROUND = 214;
  const hero = { x: 110, anim: 'stance', at: 0, trail: [], flash: 0, y: 0 };
  const foe = { x: 350, y: 0, kx: 0, ky: 0, flash: 0, sp: GS.MonsterArt.build('demo', 'golem') };
  // script : [début, action]
  const plan = [];
  let T = 0;
  const at = (dt, fn) => { T += dt; plan.push([T, fn]); };
  const seq = (name, fxFn) => {
    at(0, () => { hero.anim = name; hero.at = 0; });
    const hit = MR.HIT[name];
    if (fxFn) at(hit, fxFn);
    T += MR.seqDur(name) - (hit || 0);
  };
  const hitFoe = (power = 1, up = 0) => { foe.flash = 1; foe.kx = 6 * power; foe.ky = -up; shake = Math.max(shake, 2 * power); stop = 0.06 * power; };
  let shake = 0, stop = 0;
  at(1.0, () => { hero.anim = 'run'; hero.at = 0; hero.moving = 260; });
  at(0.62, () => { hero.moving = 0; hero.x = 300; hero.anim = 'stance'; fx.dust(hero.x + 4, GROUND, { n: 8, vx: 60 }); });
  seq('jab', () => { fx.crescent(foe.x - 14, GROUND - 40, { r: 16, angle: 0, span: 1.6, scheme: 'blood', flat: 0.45, dur: 0.18 }); fx.impact(foe.x - 10, GROUND - 38, { scheme: 'blood', spark: '#ff5a8a' }); hitFoe(0.7); });
  seq('cross', () => { fx.crescent(foe.x - 12, GROUND - 38, { r: 20, angle: 0.1, span: 2.0, scheme: 'blood', flat: 0.5, tilt: -0.2 }); fx.impact(foe.x - 8, GROUND - 40, { scheme: 'blood', spark: '#ff5a8a' }); hitFoe(1); });
  seq('uppercut', () => { fx.crescent(foe.x - 8, GROUND - 46, { r: 26, angle: -1.2, span: 2.4, dir: -1, scheme: 'blood', flat: 0.9, tilt: 0.3 }); fx.impact(foe.x - 6, GROUND - 52, { scheme: 'blood', big: true, spark: '#ff5a8a' }); hitFoe(1.2, 14); });
  seq('airKick', () => { fx.crescent(foe.x - 6, GROUND - 52, { r: 28, angle: 0.4, span: 2.6, scheme: 'fire', flat: 0.6, tilt: 0.2 }); fx.impact(foe.x, GROUND - 50, { scheme: 'fire', big: true }); fx.speedLines(foe.x, GROUND - 50, { dir: 1, n: 12 }); hitFoe(1.6, 6); });
  at(0.3, () => { hero.anim = 'jump'; hero.at = 0; hero.moving = -300; });
  at(0.4, () => { hero.moving = 0; hero.x = 150; hero.anim = 'stance'; fx.dust(hero.x, GROUND, { n: 10 }); });
  seq('power', () => { fx.groundRing(hero.x + 6, GROUND, { scheme: 'blood', r1: 60, dur: 0.7, h: 40 }); shake = 3; hero.aura = 1; });
  at(0.6, () => { hero.aura = 0; hero.anim = 'stance'; hero.at = 0; });
  at(0.8, () => {});
  const TOTAL = T;
  window.DEMO_DUR = TOTAL;

  let simT = 0, pi = 0;
  const step = (dt) => {
    simT += dt;
    while (pi < plan.length && plan[pi][0] <= simT) plan[pi++][1]();
    const wdt = stop > 0 ? (stop -= dt, dt * 0.1) : dt;
    hero.at += wdt;
    if (hero.moving) {
      hero.x += hero.moving * wdt;
      hero.trail.push({ x: hero.x, a: 0.5, f: rig.anim(hero.anim, hero.at) });
      if (hero.anim === 'run' && Math.random() < 0.3) fx.dust(hero.x - 6, GROUND, { n: 2, vx: -40 });
    }
    for (const p of hero.trail) p.a -= wdt * 3;
    hero.trail = hero.trail.filter((p) => p.a > 0);
    if (hero.aura && Math.random() < 0.9) fx.flame(hero.x + U_rand(-14, 14), GROUND, { scheme: 'blood', n: 3, speed: 60, w: 8 });
    foe.flash = Math.max(0, foe.flash - wdt * 5);
    foe.kx *= Math.pow(0.002, wdt); foe.ky *= Math.pow(0.01, wdt);
    shake = Math.max(0, shake - wdt * 14);
    fx.update(wdt);
  };
  function U_rand(a, b) { return a + Math.random() * (b - a); }

  const draw = () => {
    const sx = shake ? (Math.random() - 0.5) * shake * 2 : 0;
    GS.BG.draw('castle', simT, hero.x * 0.3 + sx, 0);
    ctx.save();
    ctx.translate(Math.round(sx), 0);
    fx.draw(ctx, true);
    // ennemi
    const fs = foe.sp;
    GS.R.ellipse(foe.x, GROUND + 1, 16, 3, 'rgba(0,0,0,0.4)');
    const ex = Math.round(foe.x + foe.kx - fs.w / 2), ey = Math.round(GROUND - fs.h + foe.ky);
    ctx.drawImage(fs.body, ex, ey);
    if (foe.flash > 0) { ctx.globalAlpha = foe.flash; ctx.drawImage(fs.white, ex, ey); ctx.globalAlpha = 1; }
    // traînée
    for (const p of hero.trail) {
      ctx.globalAlpha = p.a * 0.5; ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(GS.Pix.silhouette(p.f.canvas, '#ff4060'), Math.round(p.x - MR.FOOT.x), GROUND - MR.FOOT.y);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    // héros
    GS.R.ellipse(hero.x, GROUND + 1, 14, 3, 'rgba(0,0,0,0.4)');
    const f = rig.anim(hero.anim, hero.at);
    if (hero.aura) {
      const red = GS.Pix.silhouette(f.canvas, '#ff2040');
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5 + Math.sin(simT * 30) * 0.2;
      for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(red, Math.round(hero.x - MR.FOOT.x) + dx, GROUND - MR.FOOT.y + dy);
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    ctx.drawImage(f.canvas, Math.round(hero.x - MR.FOOT.x), GROUND - MR.FOOT.y);
    fx.draw(ctx, false);
    ctx.restore();
  };
  window.renderAt = (t) => { while (simT + 1 / 60 <= t) step(1 / 60); draw(); };
  renderAt(0);
</script>
</body>
</html>
