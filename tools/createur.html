<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créateur de perso</title>
<style>
  :root { --bg: #120e1c; --panel: #1c1730; --line: #3a3156; --txt: #e8e4f4; --dim: #9a90b8; --acc: #ff3a4a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 13px/1.35 system-ui, sans-serif; display: flex; min-height: 100vh; }
  #side { width: 330px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 12px 14px 20px; overflow-y: auto; max-height: 100vh; }
  h1 { font-size: 17px; margin: 0 0 4px; color: var(--acc); letter-spacing: .5px; }
  .sub { color: var(--dim); margin-bottom: 10px; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 0 0 10px; padding: 8px 10px 6px; }
  legend { color: var(--acc); font-weight: 600; padding: 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { width: 92px; color: var(--dim); flex: none; }
  select, input[type=text] { flex: 1; background: #0e0b18; color: var(--txt); border: 1px solid var(--line); border-radius: 4px; padding: 3px 4px; min-width: 0; }
  input[type=color] { width: 40px; height: 24px; border: none; background: none; padding: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .chips label { width: auto; color: var(--txt); }
  button { background: #2a2244; color: var(--txt); border: 1px solid var(--line); border-radius: 5px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--acc); }
  button.main { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: auto; }
  canvas { image-rendering: pixelated; background: #1a1528; border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
  #bar { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  textarea { width: 100%; height: 74px; background: #0e0b18; color: #b8f0c8; border: 1px solid var(--line); border-radius: 4px; font: 12px/1.3 ui-monospace, monospace; padding: 6px; resize: vertical; }
  #out { padding: 0 12px 12px; }
  .hint { color: var(--dim); font-size: 12px; }
  @media (max-width: 760px) { body { flex-direction: column; } #side { width: 100%; max-height: none; border-right: none; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="side">
  <h1>Créateur de perso</h1>
  <div class="sub">Style image : tête, corps et jambes pris sur les héros relevés sur image, recolorés. Format de Djegui : l'ancien style, pièce par pièce.</div>
  <div id="form"></div>
</div>
<div id="main">
  <div id="stage"><canvas id="c" width="960" height="460"></canvas></div>
  <div id="bar">
    <button class="main" id="rand">Aléatoire</button>
    <button id="gore">Arracher un membre</button>
    <button id="heal">Recoller</button>
    <button id="copy">Copier la description</button>
    <span class="hint">Colle la description dans <code>rigSpec</code> d'un héros (src/data/units.js).</span>
  </div>
  <div id="out"><textarea id="spec" spellcheck="false"></textarea></div>
</div>

<script src="../src/core/util.js"></script>
<script src="../src/gfx/pixelart.js"></script>
<script src="../src/gfx/modrig.js"></script>
<script src="../src/gfx/djegui_art.js"></script>
<script src="../src/gfx/heads.js"></script>
<script src="../src/gfx/outfits.js"></script>
<script src="../src/gfx/azura_art.js"></script>
<script src="../src/gfx/azura.js"></script>
<script src="../src/gfx/vesper_art.js"></script>
<script src="../src/gfx/vesper.js"></script>
<script src="../src/gfx/sakura_art.js"></script>
<script src="../src/gfx/sakura.js"></script>
<script src="../src/gfx/valka_art.js"></script>
<script src="../src/gfx/valka.js"></script>
<script src="../src/gfx/rodeur_art.js"></script>
<script src="../src/gfx/combattant_art.js"></script>
<script src="../src/gfx/lyceen_art.js"></script>
<script src="../src/gfx/variants.js"></script>
<script src="../src/gfx/gore.js"></script>
<script>
(function () {
  const O = GS.Outfits;
  const V = GS.Variants;
  const opts = (obj) => Object.keys(obj).map((k) => [k, obj[k].label || k]);
  const HEADS = [['hood', 'Capuche (Djegui)'], ['short', 'Courts'], ['spiky', 'En pics'], ['buzz', 'Rasés'], ['bob', 'Carré'], ['long', 'Longs'], ['ponytail', 'Queue de cheval'], ['twintails', 'Couettes'], ['mane', 'Crinière'], ['cap', 'Casquette'], ['helmet', 'Casque'], ['mask', 'Masque de sectaire']];
  const WEAPONS = [['', 'Aucune (poings)']].concat(Object.keys(V.WEAPONS).map((k) => [k, k]));
  const PRINTS = [['', 'Aucun'], ['stripes', 'Rayures']].concat(Object.keys(O.PRINTS).map((k) => [k, k]));
  const ACCS = Object.keys(O.HEAD_ACC).map((k) => [k, O.HEAD_ACC[k].label]).concat([['elf', "Oreilles d'elfe"]]);

  // modèles relevés sur image (Azura, Vesper, Sakura, Valka...)
  const BASES = Object.entries(GS.REF_BASES).map(([k, b]) => [k, `${b.name} (${b.label})`]);
  const STYLES = [['image', 'Image (comme les héros relevés)'], ['djegui', 'Format de Djegui (ancien)']];
  // Champs du formulaire : [clé, libellé, type, options, style] (style : seulement pour ce style)
  const GROUPS = [
    ['Style', [['style', 'Style', 'sel', STYLES], ['refHead', 'Tête de', 'sel', BASES, 'image'], ['refTop', 'Corps de', 'sel', BASES, 'image'], ['refLegs', 'Jambes de', 'sel', BASES, 'image']]],
    ['Tête', [['head', 'Coiffure', 'sel', HEADS, 'djegui'], ['hair', 'Cheveux', 'col'], ['hood', 'Capuche', 'col', null, 'djegui'], ['skin', 'Peau', 'col'], ['eyes', 'Yeux', 'col'], ['acc', 'Accessoires', 'multi', ACCS, 'djegui'], ['band', 'Bandeau', 'col', null, 'djegui']]],
    ['Haut', [['top', 'Type', 'sel', opts(O.TOPS), 'djegui'], ['jacket', 'Couleur', 'col'], ['inner', 'Dessous', 'col'], ['metal', 'Métal', 'col', null, 'image'], ['accent', 'Détails', 'col', null, 'djegui'], ['print', 'Imprimé', 'sel', PRINTS, 'djegui'], ['printColor', "Couleur imp.", 'col', null, 'djegui'], ['gloves', 'Gants', 'col?', null, 'djegui']]],
    ['Bas', [['bottom', 'Type', 'sel', opts(O.BOTTOMS), 'djegui'], ['pants', 'Couleur', 'col'], ['belt', 'Ceinture', 'col?', null, 'djegui']]],
    ['Chaussures', [['shoeType', 'Type', 'sel', opts(O.SHOES), 'djegui'], ['shoes', 'Couleur', 'col'], ['sole', 'Semelle', 'col?', null, 'djegui']]],
    ['Arme', [['weapon', 'Arme', 'sel', WEAPONS], ['blade', 'Lame', 'col?'], ['gem', 'Gemme / lumières', 'col?']]],
  ];
  const spec = { style: 'image', refHead: BASES[0][0], refTop: BASES[0][0], refLegs: BASES[0][0], metal: '#a0a0a8', head: 'short', hair: '#2a1a12', hood: '#e8e4ec', skin: '#c88a60', eyes: '#402010', acc: [], band: '#c02030', top: 'tshirt', jacket: '#e8e4ec', inner: '#1a1a1a', accent: '#e8c048', print: 'skull', printColor: '#1a1418', bottom: 'jeans', pants: '#3a5a8a', shoeType: 'sneakers', shoes: '#f0f0f4', weapon: '' };
  const on = {};

  const form = document.getElementById('form');
  for (const [title, fields] of GROUPS) {
    const fs = document.createElement('fieldset');
    fs.innerHTML = `<legend>${title}</legend>`;
    for (const [key, label, type, list, only] of fields) {
      const row = document.createElement('div');
      row.className = 'row';
      if (only) row.dataset.only = only;
      row.innerHTML = `<label>${label}</label>`;
      if (type === 'sel') {
        const s = document.createElement('select');
        s.id = 'f_' + key;
        for (const [v, l] of list) s.add(new Option(l, v));
        s.value = spec[key] || '';
        s.onchange = () => { spec[key] = s.value; rebuild(); };
        row.append(s);
      } else if (type === 'multi') {
        const box = document.createElement('div');
        box.className = 'chips';
        for (const [v, l] of list) {
          const lb = document.createElement('label');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.dataset.v = v;
          cb.className = 'acc';
          cb.onchange = () => { spec.acc = [...document.querySelectorAll('.acc:checked')].map((c) => c.dataset.v); rebuild(); };
          lb.append(cb, ' ' + l);
          box.append(lb);
        }
        row.append(box);
      } else {
        const opt = type === 'col?';
        if (opt) {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.id = 'o_' + key;
          cb.onchange = () => { on[key] = cb.checked; rebuild(); };
          row.append(cb);
        }
        const c = document.createElement('input');
        c.type = 'color';
        c.id = 'f_' + key;
        c.value = spec[key] || (key === 'gloves' ? '#c02030' : key === 'belt' ? '#2a2024' : key === 'sole' ? '#2a2228' : key === 'gem' ? '#60f0ff' : '#c8d0e0');
        c.oninput = () => { spec[key] = c.value; if (opt) { on[key] = true; document.getElementById('o_' + key).checked = true; } rebuild(); };
        spec[key] = c.value;
        row.append(c);
      }
      fs.append(row);
    }
    form.append(fs);
  }

  // Lignes du formulaire propres à un style : cachées pour l'autre.
  const showStyle = () => document.querySelectorAll('[data-only]').forEach((r) => (r.style.display = r.dataset.only === spec.style ? '' : 'none'));
  // Description propre (sans les champs inutiles) à coller dans units.js.
  const clean = () => {
    if (spec.style === 'image') {
      const s = { ref: { head: spec.refHead, top: spec.refTop, legs: spec.refLegs } };
      for (const k of ['hair', 'skin', 'eyes', 'jacket', 'inner', 'metal', 'pants', 'shoes']) s[k] = spec[k];
      if (spec.weapon) s.weapon = spec.weapon;
      for (const k of ['blade', 'gem']) if (on[k]) s[k] = spec[k];
      return s;
    }
    const s = {};
    const keep = (k) => {
      if (k === 'hood') return spec.head === 'hood';
      if (k === 'hair') return spec.head !== 'hood';
      if (['gloves', 'belt', 'sole', 'blade', 'gem'].includes(k)) return !!on[k] && (k !== 'blade' && k !== 'gem' || !!spec.weapon);
      if (k === 'inner') return ['coat', 'jacket'].includes(spec.top);
      if (k === 'accent') return ['uniform', 'hoodie'].includes(spec.top);
      if (k === 'print' || k === 'printColor') return !!spec.print && !['coat', 'uniform'].includes(spec.top);
      if (k === 'band') return spec.acc.includes('headband') || spec.acc.includes('blindfold');
      if (k === 'acc') return spec.acc.length > 0;
      if (k === 'weapon') return !!spec.weapon;
      return true;
    };
    for (const k of Object.keys(spec)) if (keep(k) && !['style', 'refHead', 'refTop', 'refLegs', 'metal'].includes(k)) s[k] = spec[k];
    if (s.belt) s.belt = spec.belt;
    return s;
  };
  const toJs = (o) => '{ ' + Object.entries(o).map(([k, v]) => `${k}: ${Array.isArray(v) ? '[' + v.map((x) => `'${x}'`).join(', ') + ']' : typeof v === 'object' ? toJs(v) : `'${v}'`}`).join(', ') + ' }';

  let rig = null;
  function rebuild() {
    const s = clean();
    showStyle();
    try {
      rig = s.ref ? V.makeRefChar(s) : V.makeChar(V.build(s), s, V.animMapFor(s));
    } catch (e) {
      console.error(e);
    }
    document.getElementById('spec').value = 'rigSpec: ' + toJs(s) + ',';
  }

  // ---------------------------------------------------------------- aperçu animé
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const M = GS.ModRig;
  const ROWS = [
    [['idle', 'Repos'], ['walk', 'Marche'], ['run', 'Course'], ['stance', 'Garde']],
    [['ATK1', 'Attaque 1'], ['ATK2', 'Attaque 2'], ['kick', 'Coup de pied'], ['hurt', 'Touché']],
  ];
  const atk = (i) => {
    const w = spec.weapon;
    if (!w) return ['jab', 'cross'][i];
    if (w === 'bow') return 'shoot';
    if (w === 'pistol') return i ? 'jab' : 'fire';
    if (w === 'staff') return i ? 'castStaff' : 'slashA';
    if (w === 'spear' || w === 'rapier') return 'thrust';
    return i ? 'slashB' : 'slashA';
  };
  let t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    ctx.fillStyle = '#1a1528';
    ctx.fillRect(0, 0, c.width, c.height);
    // cadre de l'image du rig montré (assez large pour les héros relevés sur image)
    const SX = 8;
    const SY = 6;
    const SW = 80;
    const SH = 84;
    const Z = 2.5;
    const cw = SW * Z;
    const chh = SH * Z;
    ctx.font = '13px system-ui';
    ROWS.forEach((row, ry) =>
      row.forEach(([a0, label], rx) => {
        if (!rig) return;
        let a = a0 === 'ATK1' ? atk(0) : a0 === 'ATK2' ? atk(1) : a0;
        let tt = t;
        if (M.SEQ[a] || M.SEQ[(rig.spec.animMap || {})[a]]) {
          const name = M.SEQ[a] ? a : rig.spec.animMap[a];
          const d = M.seqDur(name) + 0.35;
          tt = t % d;
        }
        const f = rig.anim(a, tt);
        const x = 12 + rx * (cw + 34);
        const y = 8 + ry * (chh + 8);
        ctx.fillStyle = '#231d36';
        ctx.fillRect(x, y, cw + 20, chh);
        ctx.fillStyle = '#9a90b8';
        ctx.fillText(label, x + 6, y + 16);
        ctx.drawImage(f.canvas, SX, SY, SW, SH, x + 10, y, cw, chh);
      })
    );
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------------------------------------------------------------- boutons
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const hsl = (h, s, l) => {
    const k = (n) => (n + h / 30) % 12;
    const f = (n) => l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return '#' + [f(0), f(8), f(4)].map((v) => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
  };
  const randCol = (sat = 0.6, l = [0.15, 0.75]) => hsl(Math.random() * 360, sat * Math.random() + 0.1, l[0] + Math.random() * (l[1] - l[0]));
  const SKINS = ['#f6d6c0', '#f2c8a6', '#e0ac80', '#c88a60', '#a06a48', '#8a5a3a', '#5a3a28'];
  const set = (k, v) => {
    spec[k] = v;
    const el = document.getElementById('f_' + k);
    if (el) el.value = v;
  };
  document.getElementById('rand').onclick = () => {
    for (const k of ['refHead', 'refTop', 'refLegs']) set(k, pick(BASES)[0]);
    set('metal', randCol(0.3, [0.4, 0.85]));
    set('head', pick(HEADS.filter((h) => h[0] !== 'mask' && h[0] !== 'helmet'))[0]);
    set('hair', pick(['#1a1410', '#2a1a12', '#5a3a22', '#d8a040', '#f0f0f8', '#c02040', '#3a7ac8', '#ff80c0', '#40c8c8', randCol(0.8, [0.3, 0.7])]));
    set('hood', randCol(0.4, [0.2, 0.9]));
    set('skin', pick(SKINS));
    set('eyes', randCol(0.9, [0.3, 0.6]));
    set('top', pick(Object.keys(O.TOPS)));
    set('jacket', randCol(0.6, [0.1, 0.85]));
    set('inner', randCol(0.5, [0.1, 0.9]));
    set('print', pick(PRINTS)[0]);
    set('printColor', randCol(0.8, [0.4, 0.9]));
    set('bottom', pick(Object.keys(O.BOTTOMS)));
    set('pants', randCol(0.4, [0.08, 0.5]));
    set('shoeType', pick(Object.keys(O.SHOES)));
    set('shoes', randCol(0.5, [0.1, 0.95]));
    set('weapon', pick(WEAPONS)[0]);
    spec.acc = Math.random() < 0.4 ? [pick(ACCS)[0]] : [];
    document.querySelectorAll('.acc').forEach((cb) => (cb.checked = spec.acc.includes(cb.dataset.v)));
    rebuild();
  };
  document.getElementById('gore').onclick = () => {
    if (!rig) return;
    const parts = ['fistF', 'loF', 'armF', 'fistB', 'loB', 'armB', 'kneeF', 'legF', 'kneeB', 'legB', 'head'].filter((p) => !rig.lost[p]);
    if (parts.length) rig.lose(pick(parts));
  };
  document.getElementById('heal').onclick = () => rig && rig.heal();
  document.getElementById('copy').onclick = () => {
    const ta = document.getElementById('spec');
    ta.select();
    try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand('copy'); }
  };
  rebuild();
})();
</script>
</body>
</html>
